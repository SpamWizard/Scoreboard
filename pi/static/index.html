<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Terminal Relay — Live Scoreboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Aldrich&family=Armata&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="space" aria-hidden="true">
    <div class="nebula"></div>
    <div id="stars" class="stars"></div>
    <div class="scanlines"></div>
  </div>

  <div class="frame">
    <header class="top">
      <div class="brand">
        <p class="eyebrow">
          <span class="mark">SC / 26</span>
          <span class="sep">·</span>
          Deep Space · Good Company
        </p>
        <p class="wordmark">SAINTCON</p>
        <h1>Terminal Relay</h1>
        <p class="tagline">Your mission begins here.</p>
      </div>
      <div class="meta">
        <p class="flight">FLIGHT 026 / PROVO, EARTH</p>
        <p id="status-line" class="status">Acquiring signal…</p>
      </div>
    </header>

    <main>
      <section class="board" aria-label="Leaderboard">
        <div class="board-head">
          <span class="pill">> LIVE LEADERBOARD</span>
          <span class="pill soft">DEEP SPACE CIRCUIT</span>
        </div>
        <div class="cols" aria-hidden="true">
          <span>Rank</span>
          <span>Crew</span>
          <span>Score</span>
        </div>
        <ol id="rows" class="rows"></ol>
        <p id="empty" class="empty hidden">Awaiting first crew transmission…</p>
      </section>
    </main>

  </div>

  <script src="/static/board.js"></script>
</body>
</html>
